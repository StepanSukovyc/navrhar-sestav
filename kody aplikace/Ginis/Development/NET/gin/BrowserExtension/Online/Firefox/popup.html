<!DOCTYPE html>
<html>
<head>
    <title>Gordic Browser Extension</title>
    <script src="popup.js"></script>

    <meta charset="utf-8" />
    <!-- Add icon library -->
    <link rel="stylesheet" type="text/css" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
    <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
    <div id="extensionHeader">
        <div id="logo">
            <img src="logo_gordic.png" />
        </div>
        <div id="extensionName"></div>
        <div id="description"></div>
    </div>

    <div id="buttons">
        <button id="testBtn" class="button"><span id="testBtnCnt"></span></button>
        <button id="installBtn" class="button"><span id="installBtnCnt"></span></button><!--<i class="fa fa-cloud-download"></i>-->
    </div>

    <div id="indicator" class="hidden"><i id="indicatorIcon" class="fas"></i></div>
    <div id="testText" class="hidden" role="alert" aria-live="polite"></div>
    

</body>
</html>
